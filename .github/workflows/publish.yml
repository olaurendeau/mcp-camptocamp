name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          jq --arg v "$VERSION" '
            .version = $v |
            .packages[0].version = $v |
            .packages[1].identifier = "ghcr.io/olaurendeau/mcp-camptocamp:" + $v
          ' server.json > server.tmp && mv server.tmp server.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Publish to npm
        run: |
          if npm view "@olaurendeau/mcp-camptocamp@${{ env.VERSION }}" version >/dev/null 2>&1; then
            echo "Version ${{ env.VERSION }} already on npm, skipping publish"
          else
            npm publish --access public
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Multi-platform builds and attestations need QEMU and a buildx (docker-container) builder
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          push: true
          tags: |
            ghcr.io/olaurendeau/mcp-camptocamp:${{ env.VERSION }}
            ghcr.io/olaurendeau/mcp-camptocamp:latest

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      # The MCP registry checks the npm package at the exact version and answers
      # 400 "version '<v>' was not found" until npm serves it, which can lag the publish
      - name: Wait for the npm version to be visible
        run: |
          URL="https://registry.npmjs.org/@olaurendeau/mcp-camptocamp/$VERSION"
          for attempt in $(seq 1 30); do
            if curl -fs -o /dev/null -H "Cache-Control: no-cache" "$URL"; then
              echo "npm serves @olaurendeau/mcp-camptocamp@$VERSION"
              exit 0
            fi
            echo "Attempt $attempt/30: @olaurendeau/mcp-camptocamp@$VERSION not on npm yet, retrying in 10s"
            sleep 10
          done
          echo "::error::@olaurendeau/mcp-camptocamp@$VERSION still not served by $URL after 5 minutes; rerun the failed job once it is"
          exit 1

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      # Retry only the "version not found" race (another npm edge may still lag); fail fast otherwise
      - name: Publish to MCP Registry
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/mcp-publisher.log"
          for attempt in 1 2 3 4; do
            if ./mcp-publisher publish 2>&1 | tee "$LOG"; then
              exit 0
            fi
            if ! grep -qF "version '$VERSION' was not found" "$LOG" || [ "$attempt" -eq 4 ]; then
              echo "::error::MCP Registry publish failed (attempt $attempt/4)"
              exit 1
            fi
            DELAY=$((15 * 2 ** (attempt - 1)))
            echo "Attempt $attempt/4: npm version not yet visible to the MCP Registry, retrying in ${DELAY}s"
            sleep "$DELAY"
            if ! ./mcp-publisher login github-oidc; then
              echo "::error::MCP Registry login failed before retry $((attempt + 1))/4"
              exit 1
            fi
          done
