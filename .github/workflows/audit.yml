name: Dependency audit

# Full npm audit, dev dependencies included. Weekly and manual only, never on pull requests,
# so this workflow cannot become a required check (the PR gate is the `audit` job in ci.yml).
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit
  cancel-in-progress: false

jobs:
  full-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # Stricter than the PR gate (high): a moderate or worse advisory in what users install fails the run.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      # Dev dependencies too, at the PR gate's level: a high or critical advisory in the toolchain fails the run.
      # Runs even when the production audit fails, so one run reports both.
      - name: Audit all dependencies
        if: ${{ !cancelled() }}
        run: npm audit --audit-level=high
