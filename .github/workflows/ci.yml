name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One group per PR (superseded runs are cancelled), one per commit on main (every merge gets a full run).
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    name: checks (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Supported versions: keep in sync with `engines.node` in package.json (>=22).
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests with coverage
        run: npm run test:coverage
      - name: Agent guard hook tests
        run: tests/hooks/guard.test.sh
      - name: Build
        run: npm run build

  # The ruleset requires a check named exactly `checks`; matrix jobs report as `checks (node N)`.
  # `always()` keeps this job from being skipped (a skipped required check counts as passing).
  checks:
    if: always()
    needs: node
    runs-on: ubuntu-latest
    steps:
      - name: All Node versions passed
        env:
          RESULT: ${{ needs.node.result }}
        run: |
          echo "Matrix result: $RESULT"
          if [ "$RESULT" != "success" ]; then
            echo "::error::checks failed on at least one Node version ($RESULT)"
            exit 1
          fi

  pr-size:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      MAX_LINES: 1000
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check changed lines (package-lock.json excluded)
        run: |
          BASE="origin/${{ github.base_ref }}"
          TOTAL=$(git diff --numstat "$BASE...HEAD" -- . ':(exclude)package-lock.json' \
            | awk '$1 != "-" { sum += $1 + $2 } END { print sum + 0 }')
          echo "Changed lines: $TOTAL / $MAX_LINES"
          if [ "$TOTAL" -gt "$MAX_LINES" ]; then
            echo "::error::PR changes $TOTAL lines (max $MAX_LINES). Split it into smaller PRs."
            exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: mcp-camptocamp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (MCP initialize + tools/list over stdio)
        env:
          EXPECTED_TOOLS: 15
        run: |
          USER_NAME=$(docker image inspect --format '{{.Config.User}}' mcp-camptocamp:ci)
          if [ "$USER_NAME" != "node" ]; then
            echo "::error::Image runs as '$USER_NAME', expected 'node'"
            exit 1
          fi
          # Same stdio setup as the Claude Desktop config, without network, writable filesystem or capabilities
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | timeout 30 docker run --rm -i --network none --read-only --cap-drop ALL mcp-camptocamp:ci \
            > responses.jsonl
          jq -c 'select(.id == 1) | .result.serverInfo' responses.jsonl
          TOOLS=$(jq 'select(.id == 2) | .result.tools | length' responses.jsonl)
          echo "Tools listed: ${TOOLS:-0} / $EXPECTED_TOOLS"
          if [ "${TOOLS:-0}" -ne "$EXPECTED_TOOLS" ]; then
            cat responses.jsonl
            echo "::error::tools/list returned ${TOOLS:-0} tools, expected $EXPECTED_TOOLS"
            exit 1
          fi
      - name: Smoke test (MCP over Streamable HTTP, auth, docker stop)
        run: |
          CONTAINER=mcp-http-smoke
          MCP=http://127.0.0.1:3000/mcp
          # A throwaway 40-character token, passed by name so it stays off the docker command line
          MCP_AUTH_TOKENS=$(openssl rand -hex 20)
          export MCP_AUTH_TOKENS
          fail() { echo "::error::$1"; exit 1; }
          # On failure, print the server's logs; always remove the container
          cleanup() {
            RC=$?
            if [ "$RC" -ne 0 ]; then
              echo "::group::docker logs $CONTAINER"
              docker logs "$CONTAINER" || true
              echo "::endgroup::"
            fi
            docker rm -f "$CONTAINER" > /dev/null 2>&1 || true
            exit "$RC"
          }
          trap cleanup EXIT
          post() {
            curl -sS --max-time 10 -X POST "$MCP" -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' "$@"
          }

          docker run -d --name "$CONTAINER" -e MCP_TRANSPORT=http -e MCP_AUTH_TOKENS \
            -p 127.0.0.1:3000:3000 --read-only --cap-drop ALL mcp-camptocamp:ci > /dev/null
          for _ in $(seq 1 30); do
            HEALTH=$(curl -s --max-time 2 -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/healthz || true)
            [ "$HEALTH" = 200 ] && break
            sleep 1
          done
          [ "$HEALTH" = 200 ] || fail "/healthz returned '$HEALTH' after 30 s, expected 200"

          STATUS=$(post -o /dev/null -D headers.txt -w '%{http_code}' -d '{"jsonrpc":"2.0","id":0,"method":"tools/list"}')
          [ "$STATUS" = 401 ] || fail "POST /mcp without a token returned $STATUS, expected 401"
          grep -qi '^WWW-Authenticate: Bearer' headers.txt || fail "401 without a WWW-Authenticate: Bearer header"

          AUTH="Authorization: Bearer $MCP_AUTH_TOKENS"
          post -H "$AUTH" -o initialize.json \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"0"}}}'
          jq -ce '.result.serverInfo | select(.name == "mcp-camptocamp")' initialize.json \
            || { cat initialize.json; fail "initialize over HTTP returned no serverInfo"; }

          # The same tool names as the stdio step's responses.jsonl, in any order
          post -H "$AUTH" -o tools.json -d '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
          jq -r 'select(.id == 2) | .result.tools[].name' responses.jsonl | sort > tools-stdio.txt
          jq -r '.result.tools[]?.name' tools.json | sort > tools-http.txt
          echo "Tools listed over HTTP: $(wc -l < tools-http.txt) / $(wc -l < tools-stdio.txt) over stdio"
          [ -s tools-stdio.txt ] || fail "No tool names in responses.jsonl from the stdio step"
          diff tools-stdio.txt tools-http.txt || fail "tools/list over HTTP differs from stdio"

          STATUS=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' -H "$AUTH" "$MCP")
          [ "$STATUS" = 405 ] || fail "GET /mcp returned $STATUS, expected 405"

          # Node runs as PID 1: SIGTERM must drain (at most 8 s) and exit 0, before docker's 10 s kill
          START=$(date +%s)
          docker stop -t 10 "$CONTAINER" > /dev/null
          ELAPSED=$(( $(date +%s) - START ))
          EXIT_CODE=$(docker inspect --format '{{.State.ExitCode}}' "$CONTAINER")
          echo "docker stop: ${ELAPSED} s, exit code $EXIT_CODE"
          [ "$EXIT_CODE" = 0 ] || fail "Container exited with $EXIT_CODE after docker stop, expected 0"
          [ "$ELAPSED" -le 10 ] || fail "docker stop took ${ELAPSED} s, expected at most 10 s"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
