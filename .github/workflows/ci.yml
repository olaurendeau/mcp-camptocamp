name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One group per PR (superseded runs are cancelled), one per commit on main (every merge gets a full run).
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests with coverage
        run: npm run test:coverage
      - name: Build
        run: npm run build

  pr-size:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      MAX_LINES: 1000
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check changed lines (package-lock.json excluded)
        run: |
          BASE="origin/${{ github.base_ref }}"
          TOTAL=$(git diff --numstat "$BASE...HEAD" -- . ':(exclude)package-lock.json' \
            | awk '$1 != "-" { sum += $1 + $2 } END { print sum + 0 }')
          echo "Changed lines: $TOTAL / $MAX_LINES"
          if [ "$TOTAL" -gt "$MAX_LINES" ]; then
            echo "::error::PR changes $TOTAL lines (max $MAX_LINES). Split it into smaller PRs."
            exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
